plugins { id 'com.android.application' }
android {
    namespace 'com.pixelforge.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.pixelforge.app'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        release {
            storeFile file('../pixelforge.keystore')
            storePassword 'pixelforge2026'
            keyAlias 'pixelforge'
            keyPassword 'pixelforge2026'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
